<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern To-Do App</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="title-box">
        <div class="logo">
          <i class="fa-solid fa-list-check"></i>
        </div>

        <div>
          <h1>My To-Do List</h1>
          <p>Stay organized. Get things done!</p>
        </div>
      </div>

    </div>

    <div class="input-section">
      <div class="input-box">
        <i class="fa-solid fa-pen"></i>
        <input type="text" id="taskInput" placeholder="What do you need to do?" />
      </div>

      <button id="addBtn" class="add-btn">
        <i class="fa-solid fa-plus"></i>
        Add Task
      </button>
    </div>

    <div class="filters">
      <button class="filter active">All</button>
      <button class="filter">Pending</button>
      <button class="filter">Completed</button>

      <span id="taskCount">0 Tasks</span>
    </div>

    <div id="taskList" class="task-list"></div>

    <div class="footer">
      <p><span id="completedCount">0</span> tasks completed</p>

      <div class="progress-bar">
        <div id="progress"></div>
      </div>

      <button id="clearCompleted">
        <i class="fa-solid fa-trash"></i>
        Clear Completed
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
